<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Substitute Microsoft/Apple fonts with available alternatives.
    Uses <match> with binding="strong" which Chromium-based browsers respect
    (unlike <alias> which only Firefox/GTK apps honour fully).
  -->

  <!-- Sans-serif: map to Roboto -->
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Roboto</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe UI Webfont</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Roboto</string></edit>
  </match>

  <!-- Sans-serif: map to Arimo (metric-compatible with Arial) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Arimo</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Lucida Grande</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Arimo</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Arimo</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Trebuchet MS</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Arimo</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Verdana</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Arimo</string></edit>
  </match>

  <!-- Microsoft UI fonts used in login pages / Office 365 -->
  <match target="pattern">
    <test qual="any" name="family"><string>Ebrima</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Nirmala UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Gadugi</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe Xbox Symbol</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe UI Symbol</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Meiryo UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Cambria Math</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans</string></edit>
  </match>

  <!-- Serif: map to metric-compatible alternatives -->
  <match target="pattern">
    <test qual="any" name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Book Antiqua</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Tinos</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Tinos</string></edit>
  </match>

  <!-- Monospace: map to Cousine (metric-compatible with Courier New) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Consolas</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Cousine</string></edit>
  </match>
</fontconfig>
