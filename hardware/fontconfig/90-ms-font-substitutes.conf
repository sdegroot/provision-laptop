<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Map Microsoft/Apple sans-serif fonts to available substitutes -->
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Webfont</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="same">
    <family>-apple-system</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica Neue</family>
    <prefer><family>Arimo</family></prefer>
  </alias>
  <alias binding="same">
    <family>Lucida Grande</family>
    <prefer><family>Arimo</family></prefer>
  </alias>
  <alias binding="same">
    <family>Calibri</family>
    <prefer><family>Arimo</family></prefer>
  </alias>
  <alias binding="same">
    <family>Trebuchet MS</family>
    <prefer><family>Arimo</family></prefer>
  </alias>
  <alias binding="same">
    <family>Verdana</family>
    <prefer><family>Arimo</family></prefer>
  </alias>

  <!-- Map Microsoft serif fonts to available substitutes -->
  <alias binding="same">
    <family>Cambria</family>
    <prefer><family>Caladea</family></prefer>
  </alias>
  <alias binding="same">
    <family>Book Antiqua</family>
    <prefer><family>Tinos</family></prefer>
  </alias>
  <alias binding="same">
    <family>Georgia</family>
    <prefer><family>Tinos</family></prefer>
  </alias>

  <!-- Map Microsoft monospace fonts to available substitutes -->
  <alias binding="same">
    <family>Consolas</family>
    <prefer><family>Cousine</family></prefer>
  </alias>
</fontconfig>
