# Enable Conexant SN6140 speaker amplifier via GPIO on Tongfang GX4.
# The kernel has no quirk for subsystem ID 0x1d053011, so BIOS auto-probing
# leaves all GPIO pins disabled. Without GPIO 0 driven high, the external
# speaker amp stays off and speakers produce thin, bass-less sound.
#
# The HDA patch file (loaded from /etc/firmware/ via firmware_class.path
# kernel param) sets GPIO 0 as output-high at codec init time.
options snd_hda_intel patch=hda-sn6140-speaker-amp.fw
