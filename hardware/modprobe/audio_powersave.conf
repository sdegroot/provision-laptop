# Suspend audio codec after 1 second of silence to save power.
# A short timeout avoids the pops/clicks that occur with longer
# idle periods (the codec fully powers down and the first audio
# frame after wake can glitch). 1s keeps the codec warm enough
# to avoid audible artifacts on most hardware.
#
# Revert to power_save=0 / power_save_controller=N if you hear
# pops/clicks when audio starts or on resume from suspend.
options snd_hda_intel power_save=1
options snd_hda_intel power_save_controller=Y
