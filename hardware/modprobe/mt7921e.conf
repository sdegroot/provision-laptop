# Disable ASPM (Active State Power Management) on the MediaTek MT7922 WiFi
# adapter. ASPM causes latency spikes and reduced throughput because the chip
# enters low-power states between packets and the wake-up overhead is
# significant. This is a well-known issue with the mt7921e driver.
# Trade-off: ~0.5W higher idle power draw on battery.
options mt7921e disable_aspm=1
