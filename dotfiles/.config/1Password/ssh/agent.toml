# 1Password SSH agent configuration
# Managed by provision-laptop — edits will be overwritten.
#
# Keys from all listed vaults are offered to SSH servers, in order.
# Docs: https://developer.1password.com/docs/ssh/agent/config

[[ssh-keys]]
vault = "degroot.dev"

[[ssh-keys]]
vault = "Private"

[[ssh-keys]]
vault = "Utrecht"

# Auto-approve git commit signing to avoid repeated 1Password prompts
# during rebase/batch operations. SSH authentication still requires approval.
[[ssh-keys]]
item = "SSH Key s.degrootx@gmail.com github"
vault = "degroot.dev"
sign-authority = "allow"
