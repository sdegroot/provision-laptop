# Noise suppression and echo cancellation via WebRTC audio processing.
#
# Creates a virtual "Noise Suppressed Mic" source that applies:
#   - Noise suppression (removes keyboard typing, background sounds)
#   - Echo cancellation (prevents participants hearing their own voice back)
#   - Automatic gain control (normalizes volume levels)
#
# Select "Echo Cancellation Source" as your input device in audio settings
# or in your conferencing app. PipeWire loads this automatically on startup.

context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            # Use WebRTC audio processing (built into PipeWire)
            library.name  = aec/libspa-aec-webrtc

            # Audio format
            audio.rate     = 48000
            audio.channels = 1
            audio.position = [ MONO ]

            # Capture side (physical mic -> processing)
            capture.props = {
                node.name = "echo-cancel-capture"
            }

            # Source side (processed output -> apps)
            source.props = {
                node.name        = "echo-cancel-source"
                node.description = "Noise Suppressed Mic"
            }

            # Sink side (app playback -> echo reference)
            sink.props = {
                node.name = "echo-cancel-sink"
            }

            # Playback side (echo reference -> speakers)
            playback.props = {
                node.name = "echo-cancel-playback"
            }
        }
    }
]
