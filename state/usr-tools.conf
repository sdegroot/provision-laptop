# User-level tools installed via native installers (not managed by mise)
# Format: name check_path install_command
#
# check_path: path to check for existence (~ expanded to $HOME)
# install_command: shell command to install

claude ~/.local/bin/claude curl -fsSL https://claude.ai/install.sh | bash
opencode ~/.opencode/bin/opencode curl -fsSL https://opencode.ai/install | bash
chowser /Applications/Chowser.app "${PROVISION_DIR}/bin/install-dmg" https://github.com/bsreeram08/chowser/releases/latest/download/Chowser-2.11.0.dmg Chowser
