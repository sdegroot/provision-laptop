# Flatpak permission overrides
# Format: app_id permission_type permission_value
#
# Permission types:
#   filesystem  — grant filesystem access (maps to --filesystem=)
#   env         — set environment variable (maps to --env=)
#   talk-name   — allow D-Bus session bus access (maps to --talk-name=)
#
# Note: Flatpak does NOT expand shell variables in env overrides natively.
#       The apply script expands $HOME and $PATH before passing to flatpak.
#
# Applied with: flatpak override --user

# IntelliJ needs access to mise-managed SDKs (all runtimes: java, node, python, go)
com.jetbrains.IntelliJ-IDEA-Ultimate filesystem ~/.local/share/mise:ro
com.jetbrains.IntelliJ-IDEA-Ultimate filesystem ~/.jdks:ro

# Mise shims on PATH so IntelliJ can find tools dynamically (per-project versions).
# MISE_DATA_DIR and MISE_CACHE_DIR override flatpak's XDG redirection so mise
# finds its installs and version cache at the host paths (not the empty flatpak dirs).
# Without these, mise can't resolve cached versions → falls back to `npm view` via
# the npm shim → recursive fork bomb (shim → mise → npm view → npm shim → ∞).
com.jetbrains.IntelliJ-IDEA-Ultimate env PATH=$HOME/.local/share/mise/shims:$PATH
com.jetbrains.IntelliJ-IDEA-Ultimate env MISE_DATA_DIR=$HOME/.local/share/mise
com.jetbrains.IntelliJ-IDEA-Ultimate env MISE_CACHE_DIR=$HOME/.cache/mise
com.jetbrains.IntelliJ-IDEA-Ultimate env MISE_YES=1

# Tor Browser — deny all filesystem access beyond the Flatpak sandbox.
# Only network access is allowed. No home directory, no downloads, no host files.
org.torproject.torbrowser-launcher filesystem !home
org.torproject.torbrowser-launcher filesystem !host
org.torproject.torbrowser-launcher filesystem !/tmp
org.torproject.torbrowser-launcher filesystem !/run/media

# Browsers — access to Downloads and source code
org.mozilla.firefox filesystem ~/Downloads
org.mozilla.firefox filesystem ~/scm:ro
org.mozilla.firefox talk-name org.freedesktop.Flatpak
com.brave.Browser filesystem ~/Downloads
com.brave.Browser filesystem ~/scm:ro
com.brave.Browser talk-name org.freedesktop.Flatpak
