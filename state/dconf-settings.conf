# GNOME dconf settings to apply.
# Format: dconf-key value
# Values use GVariant syntax (strings in single quotes, numbers bare, etc.)

# Dark mode
/org/gnome/desktop/interface/color-scheme 'prefer-dark'
/org/gnome/desktop/interface/gtk-theme 'Adwaita-dark'

# Touchpad — flat profile for predictable, mouse-like cursor control;
# adaptive profile decelerates slow movements, which on this low-resolution
# touchpad (12 units/mm) makes fine positioning feel sticky and imprecise.
/org/gnome/desktop/peripherals/touchpad/accel-profile 'flat'

# Touchpad — speed tuned for flat profile (linear multiplier, range -1.0 to 1.0)
/org/gnome/desktop/peripherals/touchpad/speed 0.35

# Workspaces span all monitors (not just primary)
/org/gnome/mutter/workspaces-only-on-primary false
