# GNOME dconf settings to apply.
# Format: dconf-key value
# Values use GVariant syntax (strings in single quotes, numbers bare, etc.)

# Dark mode
/org/gnome/desktop/interface/color-scheme 'prefer-dark'
/org/gnome/desktop/interface/gtk-theme 'Adwaita-dark'

# Touchpad — faster cursor speed (range -1.0 to 1.0, default 0.0)
/org/gnome/desktop/peripherals/touchpad/speed 0.25

# Screen magnifier — Ctrl+scroll to zoom the desktop (macOS-style)
/org/gnome/desktop/a11y/applications/screen-magnifier-enabled true
/org/gnome/desktop/a11y/magnifier/mouse-tracking 'proportional'
/org/gnome/desktop/a11y/magnifier/mag-factor 1.0
/org/gnome/desktop/a11y/magnifier/scroll-at-edges true
